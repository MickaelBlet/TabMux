# System monitoring: 2x2 grid.
titles = false  # no pane title rows (toggle with ^b T)

[[tab]]
name = "monitor"
cwd = "~"

[tab.layout]
split = "horizontal"

[[tab.layout.panes]]
split = "vertical"
panes = [{ command = "top" }, { command = "watch -n 2 df -h" }]

[[tab.layout.panes]]
split = "vertical"
panes = [
  { command = "watch -n 2 free -h" },
  { command = "tail -f /var/log/syslog", focus = true },
]
